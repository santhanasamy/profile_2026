<style>
/* ===== SCREEN STYLES ===== */
.inner, #main_content, #main_content_wrap .inner {
  max-width: 900px;
}
.header-contact {
  font-size: 0.85em;
  color: #ccc;
  margin-top: 8px;
}
.header-contact a {
  color: #fff;
  text-decoration: none;
}
.chip {
  display: inline-block;
  padding: 4px 14px;
  margin: 3px 4px;
  background: #4e4e4e;
  color: #fff;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

/* ===== PRINT STYLES ===== */
@media print {
  @page {
    margin: 0.5in 0.6in;
    size: letter;
  }

  /* --- Global reset: strip ALL theme visuals --- */
  * {
    color: #000 !important;
    background: none !important;
    background-color: transparent !important;
    background-image: none !important;
    box-shadow: none !important;
    text-shadow: none !important;
    border-color: transparent !important;
  }

  html, body {
    margin: 0 !important;
    padding: 0 !important;
    font-size: 11pt !important;
    font-family: 'Calibri', 'Segoe UI', Arial, sans-serif !important;
    line-height: 1.4 !important;
    background-color: #fff !important;
  }

  /* --- Nuke all Slate wrapper spacing ---
       .outer and .inner are the main culprits for gaps.
       Slate sets .inner { padding: 20px 10px }
       and #header_wrap .inner { padding: 50px 10px 30px }
       and #main_content { padding-top: 40px }
  */
  .outer,
  .inner,
  #header_wrap,
  #header_wrap .inner,
  #header_wrap > header,
  #main_content_wrap,
  #main_content_wrap .inner,
  #main_content {
    margin: 0 !important;
    padding: 0 !important;
    min-height: 0 !important;
    height: auto !important;
    max-width: 100% !important;
    width: 100% !important;
    border: none !important;
    background: none !important;
    background-color: transparent !important;
    background-image: none !important;
    display: block !important;
    position: static !important;
    float: none !important;
  }

  /* --- Header: compact professional block --- */
  #header_wrap {
    border-bottom: 2px solid #333 !important;
    padding-bottom: 6px !important;
    margin-bottom: 10px !important;
  }
  #project_title {
    font-size: 20pt !important;
    margin: 0 0 2px 0 !important;
    padding: 0 !important;
    letter-spacing: 0.5px;
    color: #000 !important;
  }
  #project_tagline {
    font-size: 10pt !important;
    margin: 0 0 4px 0 !important;
    padding: 0 !important;
    font-style: italic;
    color: #444 !important;
  }
  .header-contact {
    font-size: 9pt !important;
    margin: 4px 0 0 0 !important;
    color: #333 !important;
  }
  .header-contact a {
    color: #333 !important;
    text-decoration: none !important;
  }

  /* --- Footer: hide --- */
  #footer_wrap {
    display: none !important;
  }

  /* --- Headings: override Slate's h2 bg image and padding --- */
  h2 {
    font-size: 13pt !important;
    margin: 12px 0 4px 0 !important;
    padding: 0 0 2px 0 !important;
    border-bottom: 1px solid #999 !important;
    background: none !important;
    background-image: none !important;
  }
  h3 {
    font-size: 11.5pt !important;
    margin: 8px 0 3px 0 !important;
    padding: 0 !important;
  }
  h4 {
    font-size: 10.5pt !important;
    margin: 6px 0 2px 0 !important;
    padding: 0 !important;
  }

  /* --- Paragraphs: override Slate's p { margin: 10px 0 15px 0 } --- */
  p {
    margin: 3px 0 !important;
    padding: 0 !important;
    font-size: 10pt !important;
    orphans: 3;
    widows: 3;
  }

  /* --- Lists: compact --- */
  ul, ol {
    margin: 2px 0 4px 18px !important;
    padding: 0 !important;
  }
  li {
    margin: 1px 0 !important;
    padding: 0 !important;
    font-size: 10pt !important;
    line-height: 1.35 !important;
  }

  /* --- Horizontal rules --- */
  hr {
    border: none !important;
    border-top: 1px solid #ccc !important;
    margin: 6px 0 !important;
    padding: 0 !important;
    height: 0 !important;
    background: none !important;
    background-image: none !important;
  }

  /* --- Tables --- */
  table {
    width: 100% !important;
    border-collapse: collapse !important;
    margin: 4px 0 6px 0 !important;
    font-size: 9.5pt !important;
    border: none !important;
  }
  th {
    background-color: #f0f0f0 !important;
    font-weight: 700 !important;
    text-align: left !important;
    padding: 3px 8px !important;
    border: 1px solid #ccc !important;
    color: #000 !important;
  }
  td {
    padding: 3px 8px !important;
    border: 1px solid #ccc !important;
    vertical-align: top !important;
  }

  /* --- Chips: bordered outlines --- */
  .chip {
    background: none !important;
    color: #000 !important;
    border: 1px solid #888 !important;
    padding: 1px 8px !important;
    margin: 1px 2px !important;
    font-size: 8.5pt !important;
    border-radius: 10px;
  }

  /* --- Links: clean, no URL printing --- */
  a {
    color: #000 !important;
    text-decoration: none !important;
  }
  a[href]::after {
    content: none !important;
  }

  /* --- Bold sub-headings (like "Engineering Leadership & Mentorship") ---
       In markdown these render as <p><strong>text</strong></p>.
       Must stay with the content that follows them.
  */
  p > strong:only-child {
    display: block;
    margin: 6px 0 2px 0;
    font-size: 10pt !important;
  }

  /* --- PAGE BREAK CONTROLS ---
       Key rules:
       1. Headings and bold sub-headings must NOT be orphaned at page bottom
       2. Tables should stay together
       3. Do NOT use page-break-inside:avoid on <section> — it wraps all
          content and forces everything to page 2
  */
  h2, h3, h4 {
    page-break-after: avoid !important;
    break-after: avoid !important;
  }
  h2 + *, h3 + *, h4 + * {
    page-break-before: avoid !important;
    break-before: avoid !important;
  }

  /* Bold paragraphs acting as sub-section titles */
  p:has(> strong:only-child) {
    page-break-after: avoid !important;
    break-after: avoid !important;
  }
  p:has(> strong:only-child) + ul,
  p:has(> strong:only-child) + ol,
  p:has(> strong:only-child) + p {
    page-break-before: avoid !important;
    break-before: avoid !important;
  }

  /* Tables stay together */
  table {
    page-break-inside: avoid !important;
    break-inside: avoid !important;
  }

  /* Italic role/context lines stay with their heading */
  em {
    font-size: 9.5pt !important;
  }

  /* Float dates stay right-aligned */
  span[style*="float:right"] {
    font-size: 9pt !important;
  }
}
</style>
